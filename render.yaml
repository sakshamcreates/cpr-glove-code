services:
  - type: web
    name: manomitra-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ML_SERVICE_URL
        sync: false
      - key: ML_SERVICE_TIMEOUT_MS
        value: 6000
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: MY_WHATSAPP_NUMBER
        sync: false
  - type: web
    name: manomitra-ai-engine
    runtime: docker
    rootDir: ai-engine
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /docs
    envVars:
      - key: BHASHINI_USER_ID
        sync: false
      - key: BHASHINI_API_KEY
        sync: false
      - key: BHASHINI_INFERENCE_KEY
        sync: false
